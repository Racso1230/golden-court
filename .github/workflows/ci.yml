name: CI

on:
  push:
    branches:
      - main
      - 'redesign/**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: golden_court_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: PHP checks (Pint, PHPStan, Pest)
        run: composer check

      - name: Generated TypeScript types are up to date
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/js/types/generated.d.ts

      # The steps below are what `npm run check` runs, one step each so a
      # failure names its check. `gc_run` mirrors the output and, on failure,
      # turns its last lines into error annotations, which are readable
      # without access to the run logs.
      - name: Define the check runner
        run: |
          cat > "$RUNNER_TEMP/gc_run.sh" <<'SH'
          #!/usr/bin/env bash
          set -o pipefail
          log="$RUNNER_TEMP/check.log"
          if ! "$@" 2>&1 | tee "$log"; then
            tail -n 40 "$log" | sed -e 's/%/%25/g' -e 's/^/::error::/'
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/gc_run.sh"

      - name: Lint (oxlint)
        run: $RUNNER_TEMP/gc_run.sh npm run lint

      - name: Formatting (oxfmt)
        run: $RUNNER_TEMP/gc_run.sh npm run format:check

      - name: Build
        run: $RUNNER_TEMP/gc_run.sh npm run build

      - name: Build the SSR bundle
        run: $RUNNER_TEMP/gc_run.sh npm run build:ssr

      - name: SSR bundle was built
        run: test -f bootstrap/ssr/app.js

      - name: Type-check (vue-tsc)
        run: $RUNNER_TEMP/gc_run.sh npm run type-check

      - name: Vitest
        run: $RUNNER_TEMP/gc_run.sh npm run test
